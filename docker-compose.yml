services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-skiniq_prod_db}
      - SECRET_KEY=${SECRET_KEY:-prod_super_secret_key_12345}
      - ENVIRONMENT=production
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-true}
